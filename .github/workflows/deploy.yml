name: deploy

# 触发条件：当代码推送到 master 分支或手动触发时运行
on:
  push:
    branches: [master]
  workflow_dispatch: # 允许在 GitHub Actions 页面手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 检出代码仓库
      - uses: actions/checkout@v4
        with:
          # 拉取完整的 git 历史记录（用于获取提交信息等）
          fetch-depth: 0

      # 设置 pnpm 包管理器
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # 设置 Node.js 环境
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20' # React 19 和 react-scripts 5.x 需要 Node 18+
          cache: 'pnpm' # 启用 pnpm 缓存以加速依赖安装

      # 安装项目依赖
      - name: Install dependencies
        run: pnpm install --frozen-lockfile # 使用锁文件确保依赖版本一致

      # 构建生产版本
      - name: Build
        run: pnpm build # 执行构建脚本，输出到 build 目录

      # 部署到 GitHub Pages
      - name: Deploy to GitHub Pages
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: gh-pages # 部署目标分支
          build_dir: ./build # 构建输出目录
        env:
          # GitHub Token 用于推送代码到 gh-pages 分支
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
